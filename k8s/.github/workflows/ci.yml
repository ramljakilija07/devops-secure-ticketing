name: CI - build and scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, frontend, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ticketing-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

      - name: Trivy scan (quality gate)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ticketing-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
