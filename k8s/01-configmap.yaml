apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketing-config
  namespace: ticketing
data:
  POSTGRES_DB: "ticketing"
  POSTGRES_HOST: "postgres"
  PGDATA: "/var/lib/postgresql/data/pgdata"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  API_PORT: "8080"
  FRONTEND_PORT: "3000"
  QUEUE_NAME: "ticket_orders"
  API_BASE_URL: "http://api-ticketing.apps.ocp4.example.com"
  NODE_ENV: "production"
